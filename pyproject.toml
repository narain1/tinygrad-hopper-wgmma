[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hopper-wgmma"
version = "0.1.0"
description = "Small Hopper WGMMA GEMM experiment built on tinygrad"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[tool.setuptools]
packages = ["hopper_wgmma"]

[tool.ruff.lint]
select = ["E", "F"]
